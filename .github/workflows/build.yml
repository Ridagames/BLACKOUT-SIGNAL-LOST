
name: Build PS3 Homebrew

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "===== Root ====="
          pwd
          ls -la
          echo "===== Sources ====="
          find source -maxdepth 2 -type f 2>/dev/null || true
          test -f Makefile
          test -d source
          test -f BLACKOUT_MENU.png

      - name: Diagnose FreeType
        run: |
          docker run --rm hldtux/ps3dev:latest bash -lc '
            echo "===== FreeType headers ====="
            find /usr/local/ps3dev \
              \( -name ftheader.h -o -name ft2build.h \) \
              -type f 2>/dev/null || true

            echo "===== FreeType libraries ====="
            find /usr/local/ps3dev \
              -name "*freetype*" 2>/dev/null | head -100
          '

      - name: Build current project
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            hldtux/ps3dev:latest \
            bash -lc '
              set -eu

              export PS3DEV=/usr/local/ps3dev
              export PSL1GHT=$PS3DEV
              export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"

              HEADER="$(find "$PS3DEV" -type f -path "*/freetype/config/ftheader.h" -print -quit 2>/dev/null || true)"

              if [ -z "$HEADER" ]; then
                echo "ERROR: freetype/config/ftheader.h is missing."
                exit 1
              fi

              HEADER_DIR="$(dirname "$(dirname "$(dirname "$(dirname "$HEADER")")")")"
              export CFLAGS="${CFLAGS:-} -I$HEADER_DIR"
              export CXXFLAGS="${CXXFLAGS:-} -I$HEADER_DIR"

              make -f Makefile clean
              make -f Makefile

              test -s blackout.elf
              file blackout.elf
            '

      - name: Collect build outputs
        if: always()
        run: |
          mkdir -p dist

          if [ -s blackout.elf ]; then
            cp blackout.elf dist/
            echo "ELF generated." > dist/BUILD-STATUS.txt
          else
            echo "ELF not generated. Check build logs." > dist/BUILD-STATUS.txt
          fi

          if [ -s BLACKOUT_MENU.png ]; then
            cp BLACKOUT_MENU.png dist/
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackout-ps3-build
          path: dist/
          if-no-files-found: warn
          retention-days: 14
