name: Build BLACKOUT SIGNAL LOST PS4 - Native GNM GPU Engine

concurrency:
  group: blackout-gpu-engine-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, "ps4/**", "diagnostic/**", "rebuild/**", "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: openorbisofficial/toolchain:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Recuperer OpenGNM PS4 (API GPU GNM)
        uses: actions/checkout@v4
        with:
          repository: PS4-OpenGNM/opengnm
          ref: 4b295ca54c82c83acf308d1c646a2dfa9ae57350
          path: tools/opengnm

      - name: Compiler la bibliotheque GPU OpenGNM pour PS4
        run: |
          set -eu
          export OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK
          cp tools/opengnm/config.orbis.mak tools/opengnm/config.mak
          sed -i 's/-std=c11/-D_BSD_SOURCE -DOPENGNM_NO_MODULE_ENUM -std=c11/' tools/opengnm/config.mak
          sed -i 's/#if __has_include(<orbis\/libkernel.h>)/#if __has_include(<orbis\/libkernel.h>) \&\& !defined(OPENGNM_NO_MODULE_ENUM)/' tools/opengnm/src/driver_orbis.c
          make -C tools/opengnm lib CC=clang AR=ar
          test -s tools/opengnm/libopengnm.a
          echo "OpenGNM PS4 STATIC LIBRARY READY"

      - name: Recuperer les exemples GNM et les outils de modeles glTF
        uses: actions/checkout@v4
        with:
          repository: PS4-OpenGNM/freegnm-examples
          ref: ffd055563e5b849ebef1b276ba29e730199670f8
          path: tools/freegnm-examples

      - name: Recuperer cglm pour les matrices 3D
        uses: actions/checkout@v4
        with:
          repository: recp/cglm
          ref: b9b570b78d58ceecc704f7a4e19b84dc45937ef4
          path: tools/cglm

      - name: Recuperer SPIRV-Headers pour le compilateur PS4
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/SPIRV-Headers
          ref: 5c6004e758e0c80185ef2cee93ae5c10fa342a5b
          path: tools/SPIRV-Headers

      - name: Recuperer Vulkan-Headers pour Mesa ACO
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: b26454f3ccd67e704117a39295fa13935fd3804c
          path: tools/Vulkan-Headers

      - name: Recuperer le compilateur de shaders PS4
        uses: actions/checkout@v4
        with:
          repository: PS4-OpenGNM/opengnm-psbc
          ref: 28697f007862427ebec54388ec972ce6e3545912
          path: tools/opengnm-psbc

      - name: Installer les outils de compilation GLSL et SPIR-V
        run: |
          set -eu
          apt-get update
          apt-get install -y imagemagick glslang-tools python3-mako python3-yaml
          glslangValidator --version
          python3 -c "import mako; print('Mako ready')"

      - name: Compiler le compilateur de shaders PS4
        run: |
          set -eu
          cat > tools/opengnm-psbc/config.mak <<'EOF'
          DESTDIR=/usr/local
          BINDIR=/bin
          CC=clang
          CXX=clang++
          LD=clang++
          AR=ar
          PYTHON=python3
          OPENGNM_INCLUDE=../opengnm/include
          SHARED_FLAGS=-Iinclude -Ilibpsbc -I$(OPENGNM_INCLUDE) -I../Vulkan-Headers/include -I../SPIRV-Headers/include -Isrc -Isrc/amd -Isrc/amd/common -Isrc/amd/common/nir -Isrc/amd/compiler -Isrc/amd/vulkan -Isrc/amd/vulkan/nir -Isrc/vulkan/runtime -Isrc/vulkan/runtime/bvh -Isrc/vulkan/util -Isrc/compiler -Isrc/compiler/nir -Isrc/compiler/spirv -Isrc/gallium/include -Isrc/mesa -Isrc/mesa/main -Isrc/util -Icmd/psbc -Iinclude/mesa -idirafter openorbis-compat/include -D_XOPEN_SOURCE=700 -D_GNU_SOURCE=1 -DUTIL_ARCH_LITTLE_ENDIAN=1 -DUTIL_ARCH_BIG_ENDIAN=0 -DHAVE_STRUCT_TIMESPEC=1 -DHAVE_PTHREAD=1 -Dalloca=__builtin_alloca -DHAVE_SYSCONF=1
          CFLAGS=-std=gnu11 -Wall -O2 -g $(SHARED_FLAGS) -Wno-unused-function -Wno-unused-variable -include strings.h
          CXXFLAGS=-std=c++17 -Wall -O2 -g $(SHARED_FLAGS) -Wno-unused-function -Wno-unused-variable -include strings.h
          LDFLAGS=-lm -pthread
          EOF
          python3 - <<'PY'
          p = "tools/opengnm-psbc/src/compiler/nir/nir_algebraic.py"
          s = open(p, encoding="utf-8").read()
          old = "m.group(\n                'swizzle').removeprefix('.')"
          new = "(m.group('swizzle')[1:] if m.group('swizzle').startswith('.') else m.group('swizzle'))"
          if old not in s:
              raise SystemExit("Python 3.8 compatibility patch target not found")
          open(p, "w", encoding="utf-8").write(s.replace(old, new))
          PY
          python3 tools/opengnm-psbc/src/util/format/u_format_table.py --enums tools/opengnm-psbc/src/util/format/u_format.yaml > tools/opengnm-psbc/src/util/format/u_format_gen.h
          python3 tools/opengnm-psbc/src/util/format/u_format_table.py --header tools/opengnm-psbc/src/util/format/u_format.yaml > tools/opengnm-psbc/src/util/format/u_format_pack.h
          test -s tools/opengnm-psbc/src/util/format/u_format_pack.h
          python3 tools/opengnm-psbc/src/util/format/u_format_table.py tools/opengnm-psbc/src/util/format/u_format.yaml > tools/opengnm-psbc/src/util/format/u_format_gen.c
          test -s tools/opengnm-psbc/src/util/format/u_format_gen.h
          python3 tools/opengnm-psbc/src/compiler/builtin_types_h.py tools/opengnm-psbc/src/compiler/builtin_types.h
          python3 tools/opengnm-psbc/src/compiler/builtin_types_c.py tools/opengnm-psbc/src/compiler/builtin_types.c
          python3 tools/opengnm-psbc/src/util/process_shader_stats.py tools/opengnm-psbc/src/util/shader_stats.rnc tools/opengnm-psbc/src/util/shader_stats.xml > tools/opengnm-psbc/src/util/shader_stats.h
          test -s tools/opengnm-psbc/src/compiler/builtin_types.h
          test -s tools/opengnm-psbc/src/util/shader_stats.h
          python3 tools/opengnm-psbc/src/vulkan/util/vk_struct_type_cast_gen.py --xml tools/Vulkan-Headers/registry/vk.xml --out tools/opengnm-psbc/src/vulkan/util/vk_struct_type_cast.h --beta false
          test -s tools/opengnm-psbc/src/vulkan/util/vk_struct_type_cast.h
          python3 tools/opengnm-psbc/src/amd/packets/parse_cp_pm4_table_data_json.py tools/opengnm-psbc/src/amd/packets/cp_pm4_table_data_gfx11.json tools/opengnm-psbc/src/amd/packets/pm4_it_opcodes_gfx11.h tools/opengnm-psbc/src/amd/packets/cp_pm4_table_data_gfx12.json tools/opengnm-psbc/src/amd/packets/pm4_it_opcodes_gfx12.h gfx11 packets_h > tools/opengnm-psbc/src/amd/common/amd_cp_packets_gfx11.h
          python3 tools/opengnm-psbc/src/amd/packets/parse_cp_pm4_table_data_json.py tools/opengnm-psbc/src/amd/packets/cp_pm4_table_data_gfx11.json tools/opengnm-psbc/src/amd/packets/pm4_it_opcodes_gfx11.h tools/opengnm-psbc/src/amd/packets/cp_pm4_table_data_gfx12.json tools/opengnm-psbc/src/amd/packets/pm4_it_opcodes_gfx12.h gfx12 packets_h > tools/opengnm-psbc/src/amd/common/amd_cp_packets_gfx12.h
          test -s tools/opengnm-psbc/src/amd/common/amd_cp_packets_gfx11.h
          test -s tools/opengnm-psbc/src/amd/common/amd_cp_packets_gfx12.h
          # Generate Mesa format conversion tables and AMD GFX10/GFX11 format mappings.
          python3 tools/opengnm-psbc/src/util/format_srgb.py > tools/opengnm-psbc/src/util/format_srgb.c
          python3 tools/opengnm-psbc/src/amd/common/gfx10_format_table.py tools/opengnm-psbc/src/util/format/u_format.yaml tools/opengnm-psbc/src/amd/registers/gfx10.json tools/opengnm-psbc/src/amd/registers/gfx11.json > tools/opengnm-psbc/src/amd/common/gfx10_format_table.c
          test -s tools/opengnm-psbc/src/util/format_srgb.c
          test -s tools/opengnm-psbc/src/amd/common/gfx10_format_table.c

          # Keep BLAKE3's complete x86-64 runtime-dispatch implementation:
          # compile its four upstream Unix assembly backends into libpsbc.a.
          python3 - <<'PY'
          p = "tools/opengnm-psbc/Makefile"
          s = open(p, encoding="utf-8").read()
          anchor = "BLAKE3_OBJS = $(BLAKE3_SRCS:.c=.o)\n"
          addition = """BLAKE3_ASM_SRCS = \\
          \tsrc/util/blake3/blake3_sse2_x86-64_unix.S \\
          \tsrc/util/blake3/blake3_sse41_x86-64_unix.S \\
          \tsrc/util/blake3/blake3_avx2_x86-64_unix.S \\
          \tsrc/util/blake3/blake3_avx512_x86-64_unix.S
          BLAKE3_ASM_OBJS = $(BLAKE3_ASM_SRCS:.S=.o)
          """
          if anchor not in s:
              raise SystemExit("BLAKE3 object-list insertion point not found")
          s = s.replace(anchor, anchor + addition, 1)
          anchor = "\t$(BLAKE3_OBJS) \\\n"
          if anchor not in s:
              raise SystemExit("BLAKE3 archive insertion point not found")
          s = s.replace(anchor, anchor + "\t$(BLAKE3_ASM_OBJS) \\\n", 1)
          anchor = "%.cpp.o: %.cpp | $(GENERATED)\n"
          rule = "%.o: %.S | $(GENERATED)\n\t$(CC) $(CFLAGS) -c $< -o $@\n\n"
          if anchor not in s:
              raise SystemExit("assembly compile rule insertion point not found")
          s = s.replace(anchor, rule + anchor, 1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          grep -Fq 'blake3_avx512_x86-64_unix.S' tools/opengnm-psbc/Makefile

          # Generate the complete Mesa/ACO codegen set before Make snapshots wildcard sources.
          make -C tools/opengnm-psbc generated
          test -s tools/opengnm-psbc/src/compiler/nir/nir_intrinsics.c
          test -s tools/opengnm-psbc/src/compiler/nir/nir_intrinsics.h
          test -s tools/opengnm-psbc/src/compiler/nir/nir_opcodes.c
          test -s tools/opengnm-psbc/src/compiler/nir/nir_opcodes.h
          test -s tools/opengnm-psbc/src/compiler/nir/nir_constant_expressions.c
          test -s tools/opengnm-psbc/src/compiler/nir/nir_opt_algebraic.c
          test -s tools/opengnm-psbc/src/compiler/spirv/spirv_info.c
          test -s tools/opengnm-psbc/src/compiler/spirv/spirv_info.h
          test -s tools/opengnm-psbc/src/compiler/spirv/vtn_gather_types.c
          test -s tools/opengnm-psbc/src/amd/compiler/aco_opcodes.cpp
          test -s tools/opengnm-psbc/src/amd/compiler/aco_opcodes.h
          test -s tools/opengnm-psbc/src/amd/compiler/aco_builder.h
          test -s tools/opengnm-psbc/src/amd/common/amdgfxregs.h
          test -s tools/opengnm-psbc/src/amd/common/sid_tables.h
          make -C tools/opengnm-psbc -j2
          test -x tools/opengnm-psbc/opengnm-psbc
          tools/opengnm-psbc/opengnm-psbc --help

      - name: Installer ImageMagick
        run: |
          set -eu
          apt-get update
          convert -version

      - name: Recuperer create-fself officiel
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/create-fself
          ref: f2da6229684ce320f673c06fceac9c218f621788
          path: tools/create-fself-src

      - name: Recuperer create-gp4 officiel
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/create-gp4
          ref: bf8e66e9e9bdd92e41e1697893bc8098a151fa24
          path: tools/create-gp4-src

      - name: Installer Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.17'

      - name: Compiler create-fself
        working-directory: tools/create-fself-src/cmd/create-fself
        run: |
          set -eu
          go build -modfile=go-linux.mod -o /usr/local/bin/create-fself .
          test -x /usr/local/bin/create-fself
          /usr/local/bin/create-fself -h

      - name: Compiler create-gp4
        working-directory: tools/create-gp4-src/cmd/create-gp4
        run: |
          set -eu
          go build -o /usr/local/bin/create-gp4 .
          test -x /usr/local/bin/create-gp4
          /usr/local/bin/create-gp4 -h

      - name: Verifier les sources et le modele 3D OBJ
        run: |
          set -eu
          check_file() { test -s "$1" || { echo "FICHIER MANQUANT: $1"; exit 1; }; }
          check_file Makefile
          check_file tools/opengnm/libopengnm.a
          check_file tools/opengnm-psbc/opengnm-psbc
          check_file assets/SHADERS/nexus9.vert
          check_file assets/SHADERS/nexus9.frag
          check_file assets/SHADERS/clear.frag
          check_file assets/SHADERS/nexus9_ui.frag
          check_file assets/SHADERS/nexus9_shadow.vert
          check_file assets/SHADERS/nexus9_shadow.frag
          check_file tools/obj_to_gltf.py
          check_file source/main.cpp
          check_file source/common/graphics.cpp
          check_file source/common/graphics.h
          check_file source/common/gpu_renderer.c
          check_file source/common/gpu_renderer.h
          check_file assets/MODELS/NEXUS9_MENU.OBJ
          check_file sce_sys/ICON0.PNG
          grep -Fq 'GpuRenderer_Init' source/main.cpp
          grep -Fq 'NEXUS9_MENU.gltf' source/common/gpu_renderer.c
          grep -Fq 'GPU_OBJS' Makefile
          grep -Fq 'USRDIR/MODELS/NEXUS9_MENU.OBJ' Makefile
          if grep -Eq 'BLACKOUT_MENU.mp4|SceAvPlayer|VideoPlayer' source/main.cpp Makefile; then
            echo "ANCIEN SYSTEME VIDEO ENCORE REFERENCE"
            exit 1
          fi
          grep -Fq 'OPENGNM_LIB' Makefile
          grep -Fq 'pass_model_render' source/common/gpu_renderer.c
          grep -Fq 'gnmDrawCmdSetPsShader' source/common/gpu_renderer.c
          grep -Fq 'SceGnmDriver' Makefile
          echo "VERIFICATIONS OBJ, MENU ET BASE GPU OPEN GNM OK"

      - name: Verifier OpenOrbis et les modules PRX
        run: |
          set -eu
          test -x /usr/local/bin/create-fself
          test -x /usr/local/bin/create-gp4
          test -x /lib/OpenOrbisSDK/bin/linux/PkgTool.Core
          test -s /lib/OpenOrbisSDK/bin/data/modules/libc.prx
          test -s /lib/OpenOrbisSDK/bin/data/modules/libSceFios2.prx
          echo "MODULES OPENORBIS OK"

      - name: Compiler et creer le PKG PS4
        run: |
          set -eu
          export OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK
          export CREATE_FSELF=/usr/local/bin/create-fself
          export CREATE_GP4=/usr/local/bin/create-gp4
          export PATH="$OO_PS4_TOOLCHAIN/bin/linux:$OO_PS4_TOOLCHAIN:/usr/local/bin:$PATH"
          make clean
          python3 tools/obj_to_gltf.py assets/MODELS/NEXUS9_MENU.OBJ build/gpu-model
          glslangValidator -V -S vert assets/SHADERS/nexus9.vert -o assets/SHADERS/nexus9.vert.spv
          glslangValidator -V -S frag assets/SHADERS/nexus9.frag -o assets/SHADERS/nexus9.frag.spv
          glslangValidator -V -S frag assets/SHADERS/clear.frag -o assets/SHADERS/clear.frag.spv
          glslangValidator -V -S frag assets/SHADERS/nexus9_ui.frag -o assets/SHADERS/nexus9_ui.frag.spv
          glslangValidator -V -S vert assets/SHADERS/nexus9_shadow.vert -o assets/SHADERS/nexus9_shadow.vert.spv
          glslangValidator -V -S frag assets/SHADERS/nexus9_shadow.frag -o assets/SHADERS/nexus9_shadow.frag.spv
          tools/opengnm-psbc/opengnm-psbc -s vertex -f assets/SHADERS/nexus9.vert.spv -o assets/SHADERS/nexus9.vert.sb -4
          tools/opengnm-psbc/opengnm-psbc -s fragment -f assets/SHADERS/nexus9.frag.spv -o assets/SHADERS/nexus9.frag.sb -4
          tools/opengnm-psbc/opengnm-psbc -s fragment -f assets/SHADERS/clear.frag.spv -o assets/SHADERS/clear.frag.sb -4
          tools/opengnm-psbc/opengnm-psbc -s fragment -f assets/SHADERS/nexus9_ui.frag.spv -o assets/SHADERS/nexus9_ui.frag.sb -4
          tools/opengnm-psbc/opengnm-psbc -s vertex -f assets/SHADERS/nexus9_shadow.vert.spv -o assets/SHADERS/nexus9_shadow.vert.sb -4
          tools/opengnm-psbc/opengnm-psbc -s fragment -f assets/SHADERS/nexus9_shadow.frag.spv -o assets/SHADERS/nexus9_shadow.frag.sb -4
          python3 - <<'PY'
          p = "tools/freegnm-examples/gltf/src/pass_model.c"
          s = open(p, encoding="utf-8").read()
          s = s.replace('#include "pass_model.h"\n', '#include "pass_model.h"\n#include <math.h>\n#include <string.h>\n')
          s = s.replace("mat4s c_mmodel;\n\tvec4s c_viewpos;", "mat4s c_mmodel;\n\tmat4s c_mlight;\n\tvec4s c_viewpos;")
          s = s.replace("sizeof(ConstBuffer) == 0x110", "sizeof(ConstBuffer) == 0x150")
          s = s.replace("GnmTexture texture;\n\tGnmSampler sampler;\n\tGnmBuffer constbuf;", "GnmTexture texture;\n\tGnmSampler sampler;\n\tGnmTexture shadowTexture;\n\tGnmSampler shadowSampler;\n\tGnmBuffer constbuf;")
          s = s.replace("sizeof(PsDescSet) == 0x40", "sizeof(PsDescSet) == 0x70")
          s = s.replace("static PassModel s_mpass = {0};", "static PassModel s_mpass = {0};\nstatic GnmTexture s_shadowTexture;\nstatic GnmSampler s_shadowSampler;")
          s = s.replace("/app0/assets/misc/gltf.vert.sb", "/app0/USRDIR/SHADERS/nexus9.vert.sb")
          s = s.replace("/app0/assets/misc/gltf.frag.sb", "/app0/USRDIR/SHADERS/nexus9.frag.sb")
          s = s.replace(".y = 0.5,", ".y = 1.65,")
          s = s.replace(".z = 3.0,", ".z = 0.0,", 1)
          s = s.replace(".x = -30.0,", ".x = 0.0,")
          s = s.replace("s_mpass.cbufmem->c_mmodel = GLMS_MAT4_IDENTITY;", """s_mpass.cbufmem->c_mmodel = GLMS_MAT4_IDENTITY;
          const vec3s shadowLight = {{0.0, 4.0, 8.0}};
          const vec3s shadowTarget = {{0.0, 1.5, 22.0}};
          const vec3s shadowUp = {{0.0, 1.0, 0.0}};
          const mat4s shadowView = glms_lookat(shadowLight, shadowTarget, shadowUp);
          const mat4s shadowProjection = glms_ortho(-14.0, 14.0, -14.0, 14.0, 0.1, 60.0);
          s_mpass.cbufmem->c_mlight = glms_mat4_mul(shadowProjection, shadowView);""")
          s = s.replace(".position = (vec3s){{2.0, 2.0, 0.0}},", ".position = (vec3s){{0.0, 4.0, 8.0}},")
          s = s.replace(".falloff = calcsquaredfalloffinv(2.5),", ".falloff = calcsquaredfalloffinv(12.0),")
          s = s.replace(".color = (vec3s){{0.0, 0.85, 0.0}},", ".color = (vec3s){{0.95, 0.72, 0.48}},")
          s = s.replace(".colorintensity = 1500.0,", ".colorintensity = 42.0,", 1)
          s = s.replace(".position = (vec3s){{2.0, 2.0, 4.0}},", ".position = (vec3s){{0.0, 3.2, 22.0}},")
          s = s.replace(".falloff = calcsquaredfalloffinv(5.0),", ".falloff = calcsquaredfalloffinv(10.0),")
          s = s.replace(".color = (vec3s){{0.55, 0.0, 0.5}},", ".color = (vec3s){{0.55, 0.08, 0.06}},")
          s = s.replace(".colorintensity = 1500.0,", ".colorintensity = 26.0,", 1)
          s = s.replace("s_mpass.rotation.y += 1.0;", "s_mpass.rotation.y = 0.0;")
          s = s.replace("if (s_mpass.rotation.y >= 360.0) {\n\t\ts_mpass.rotation.y = 0.0;\n\t}", "")
          s = s.replace("// setup camera before render work", """static float lightAnimation = 0.0f;
          lightAnimation += 0.016f;
          s_mpass.cbufmem->c_lights[0].colorintensity = 42.0f * (0.92f + 0.08f * sinf(lightAnimation * 2.1f));
          s_mpass.cbufmem->c_lights[1].position.x = 0.45f * sinf(lightAnimation * 0.65f);
          s_mpass.location.x = 0.06f * sinf(lightAnimation * 0.32f);
          s_mpass.rotation.y = 0.25f * sinf(lightAnimation * 0.2f);
          // setup camera before render work""")
          s = s.replace(".texture = curmesh->material.albedo,\n\t\t\t.constbuf = s_mpass.constbuf,\n\t\t\t.sampler = s_mpass.sampler,", ".texture = curmesh->material.albedo,\n\t\t\t.constbuf = s_mpass.constbuf,\n\t\t\t.sampler = s_mpass.sampler,\n\t\t\t.shadowTexture = s_shadowTexture,\n\t\t\t.shadowSampler = s_shadowSampler,")
          s += """
          void pass_model_set_shadow(GnmTexture texture, GnmSampler sampler) {
              s_shadowTexture = texture;
              s_shadowSampler = sampler;
          }
          void pass_model_get_light_matrix(float out[16]) {
              memcpy(out, &s_mpass.cbufmem->c_mlight, sizeof(mat4s));
          }
          """
          open(p, "w", encoding="utf-8").write(s)
          p = "tools/freegnm-examples/gltf/src/pass_model.h"
          s = open(p, encoding="utf-8").read()
          s = s.replace('#include <gnm/drawcommandbuffer.h>', '#include <gnm/drawcommandbuffer.h>\n#include <gnm/texture.h>\n#include <gnm/sampler.h>')
          s = s.replace("void pass_model_update(void);", "void pass_model_update(void);\nvoid pass_model_set_shadow(GnmTexture texture, GnmSampler sampler);\nvoid pass_model_get_light_matrix(float out[16]);")
          open(p, "w", encoding="utf-8").write(s)
          p = "tools/freegnm-examples/shared/src/misc.c"
          s = open(p, encoding="utf-8").read().replace("/app0/assets/misc/clear.frag.sb", "/app0/USRDIR/SHADERS/clear.frag.sb")
          open(p, "w", encoding="utf-8").write(s)
          PY
          make V=1
          test -s source/x64/Debug/blackout.elf
          test -s source/x64/Debug/blackout.oelf
          test -s eboot.bin
          test -s sce_sys/param.sfo
          test -s sce_sys/icon0.png
          test -s build/pkg/USRDIR/MODELS/NEXUS9_MENU.OBJ
          test -s build/pkg/USRDIR/MODELS/NEXUS9_MENU.gltf
          test -s build/pkg/USRDIR/MODELS/NEXUS9_MENU.bin
          test -s build/pkg/USRDIR/SHADERS/nexus9.vert.sb
