name: Build PS3 Homebrew

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "===== Current directory ====="
          pwd
          echo "===== Root files ====="
          ls -la
          echo "===== Makefile check ====="
          if [ ! -f Makefile ]; then
            echo "ERROR: Makefile is missing from the repository root."
            exit 1
          fi
          sed -n '1,200p' Makefile
          echo "===== Source files ====="
          find source -maxdepth 2 -type f 2>/dev/null || true

      - name: Build current project
        run: |
          docker run --rm \
            -v "$PWD:/build" \
            -w /build \
            hldtux/ps3dev:latest \
            bash -lc '
              set -eux
              export PS3DEV=/usr/local/ps3dev
              export PSL1GHT=$PS3DEV
              export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"

              echo "===== Docker working directory ====="
              pwd
              ls -la

              test -f Makefile
              test -d source

              echo "===== Clean ====="
              make -f Makefile clean

              echo "===== Compile ====="
              make -f Makefile

              echo "===== Check ELF ====="
              find . -maxdepth 3 -type f -name "*.elf" -ls
              test -s blackout.elf
            '

      - name: Collect build outputs
        if: always()
        run: |
          mkdir -p dist

          if [ -s blackout.elf ]; then
            cp blackout.elf dist/
            echo "ELF generated." > dist/BUILD-STATUS.txt
          else
            echo "ELF not generated. Check build logs." > dist/BUILD-STATUS.txt
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackout-ps3-build
          path: dist/
          if-no-files-found: warn
          retention-days: 14
