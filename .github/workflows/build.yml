
name: Build PS3 Homebrew

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          set -eu
          test -f Makefile
          test -f source/main.cpp
          test -s assets/USRDIR/BLACKOUT_MENU.png

      - name: Build and inspect PS3 files
        run: |
          set -eu

          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            hldtux/ps3dev:latest \
            bash -lc '
              set -eu

              export PS3DEV=/usr/local/ps3dev
              export PSL1GHT="$PS3DEV"
              export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"

              echo "=== ENVIRONNEMENT ==="
              echo "PS3DEV=$PS3DEV"
              echo "PSL1GHT=$PSL1GHT"

              echo "=== COMPILATEUR PPU ==="
              command -v ppu-g++
              ppu-g++ --version

              echo "=== NETTOYAGE ==="
              make clean

              echo "=== COMPILATION ==="
              make V=1

              echo "=== VERIFICATION ELF ==="
              test -s blackout.elf
              ls -lh blackout.elf
              file blackout.elf

              echo "=== EN-TETE ELF ==="
              ppu-readelf -h blackout.elf || true

              echo "=== VERIFICATION SELF ==="
              if [ -s blackout.self ]; then
                ls -lh blackout.self
                file blackout.self
              else
                echo "blackout.self absent ou vide à la racine"
                find . -maxdepth 3 -name "*.self" -type f
              fi

              echo "=== CREATION PKG ==="
              make blackout.pkg

              echo "=== VERIFICATION PKG ==="
              test -s blackout.pkg
              ls -lh blackout.pkg
              file blackout.pkg

              echo "=== BUILD TERMINE ==="
            '

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: blackout-ps3-diagnostic
          path: |
            blackout.elf
            blackout.self
            blackout.pkg
          if-no-files-found: warn
          retention-days: 14
