
name: Build PS3 Homebrew

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PS3 toolchain
        run: |
          docker run --rm hldtux/ps3dev:latest bash -lc '
            export PS3DEV=/usr/local/ps3dev
            export PSL1GHT=$PS3DEV
            export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"
            echo "=== Compiler ==="
            command -v ppu-gcc
            ppu-gcc --version
            echo "=== RSX libraries ==="
            ls -l "$PS3DEV/ppu/lib/librsx.a"
            echo "=== NoRSX libraries ==="
            ls -l "$PS3DEV/portlibs/ppu/lib/libNoRSX.a"
          '

      - name: Build ELF
        run: |
          docker run --rm \
            -v "$PWD:/build" \
            -w /build \
            hldtux/ps3dev:latest \
            bash -lc '
              export PS3DEV=/usr/local/ps3dev
              export PSL1GHT=$PS3DEV
              export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"
              make clean
              make
              test -s blackout.elf
            '

      - name: Collect build outputs
        if: always()
        run: |
          mkdir -p dist
          if [ -s blackout.elf ]; then
            cp blackout.elf dist/
            echo "ELF generated." > dist/BUILD-STATUS.txt
          else
            echo "ELF not generated. Check build logs." > dist/BUILD-STATUS.txt
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackout-ps3-build
          path: dist/
          if-no-files-found: warn
          retention-days: 14
