
name: Build PS3 Homebrew

on:
  push:
    branches:
      - main
      - master
      - 'diagnostic/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          set -eu
          test -f Makefile
          test -f source/main.cpp
          test -s assets/USRDIR/BLACKOUT_MENU.png

      - name: Build and inspect PS3 files
        run: |
          set -eu

          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            hldtux/ps3dev:latest \
            bash -lc '
              set -eu

              export PS3DEV=/usr/local/ps3dev
              export PSL1GHT="$PS3DEV"
              export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"

              echo "=== INSTALLATION DE NoRSX ==="
              git clone --depth 1 https://github.com/wargio/NoRSX.git /tmp/NoRSX
              make -C /tmp/NoRSX/libNoRSX

              echo "=== ENVIRONNEMENT ==="
              echo "PS3DEV=$PS3DEV"
              echo "PSL1GHT=$PSL1GHT"

              echo "=== RECHERCHE DES HEADERS SYSUTIL ==="
              find "$PS3DEV" -iname "*sysutil*.h" -o -iname "*sysutil*.hpp" | head -80

              echo "=== COMPILATEUR PPU ==="
              command -v ppu-g++
              ppu-g++ --version

              echo "=== NETTOYAGE ==="
              make clean

              echo "=== COMPILATION ==="
              make V=1

              echo "=== VERIFICATION ELF ==="
              test -s blackout.elf
              ls -lh blackout.elf
              file blackout.elf
              ppu-readelf -h blackout.elf
              ppu-readelf -h blackout.elf | grep -q "Class:.*ELF64"
              ppu-readelf -h blackout.elf | grep -q "Data:.*big endian"
              ppu-readelf -h blackout.elf | grep -q "Type:.*EXEC"
              ppu-readelf -h blackout.elf | grep -q "Machine:.*PowerPC64"
              ppu-readelf -h blackout.elf | grep -q "Entry point address:.*0x"

              echo "=== VERIFICATION DES SYMBOLES ET DEPENDANCES ==="
              command -v ppu-nm
              ppu-nm -u blackout.elf || true

              echo "=== CREATION PKG ==="
              make blackout.pkg

              echo "=== VERIFICATION PKG ==="
              test -s blackout.pkg
              ls -lh blackout.pkg
              file blackout.pkg
              test "$(stat -c %s blackout.pkg)" -gt 100000
              test "$(stat -c %s blackout.pkg)" -lt 200000000

              echo "=== FICHIERS SELF ET EBOOT ==="
              find . -maxdepth 5 -type f \
                \( -name "*.self" -o -name "EBOOT.BIN" \) \
                -exec ls -lh {} \;

              echo "=== EMPREINTES SHA256 ==="
              sha256sum blackout.elf blackout.pkg

              echo "=== BUILD TERMINE ==="
            '

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: blackout-ps3-diagnostic
          path: |
            blackout.elf
            blackout.self
            blackout.pkg
          if-no-files-found: warn
          retention-days: 14
