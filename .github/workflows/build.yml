
name: Build PS3 Homebrew

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f Makefile
          test -f source/main.cpp
          test -f BLACKOUT_MENU.png

      - name: Prepare resources
        run: |
          mkdir -p assets/USRDIR
          cp BLACKOUT_MENU.png assets/USRDIR/BLACKOUT_MENU.png

      - name: Build ELF and PKG
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            hldtux/ps3dev:latest \
            bash -lc '
              set -eu

              export PS3DEV=/usr/local/ps3dev
              export PSL1GHT=$PS3DEV
              export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"

              HEADER="$(find "$PS3DEV" -type f \
                -path "*/freetype/config/ftheader.h" \
                -print -quit 2>/dev/null || true)"

              if [ -z "$HEADER" ]; then
                echo "ERROR: FreeType header not found"
                exit 1
              fi

              HEADER_DIR="$(dirname "$(dirname "$(dirname "$(dirname "$HEADER")")")")"
              export CFLAGS="${CFLAGS:-} -I$HEADER_DIR"
              export CXXFLAGS="${CXXFLAGS:-} -I$HEADER_DIR"

              make clean
              make
              test -s blackout.elf

              make blackout.pkg
              test -s blackout.pkg

              echo "ELF and PKG generated successfully"
              ls -lh blackout.elf blackout.pkg
            '

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p dist

          if [ -s blackout.elf ]; then
            cp blackout.elf dist/
          fi

          if [ -s blackout.pkg ]; then
            cp blackout.pkg dist/
          fi

          if [ -s BLACKOUT_MENU.png ]; then
            cp BLACKOUT_MENU.png dist/
          fi

          if [ -d assets/USRDIR ]; then
            mkdir -p dist/USRDIR
            cp -r assets/USRDIR/. dist/USRDIR/
          fi

          find dist -type f -print

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackout-ps3-build
          path: dist/
          if-no-files-found: warn
          retention-days: 14
