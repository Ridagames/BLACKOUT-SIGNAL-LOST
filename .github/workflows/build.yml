name: Build PS4 Homebrew

on:
  push:
    branches: [main, master, "ps4/**", "diagnostic/**", "rebuild/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: openorbisofficial/toolchain:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les sources et le menu
        run: |
          set -eu
          test -f Makefile
          test -s source/main.cpp
          test -s assets/USRDIR/BLACKOUT_MENU.png
          grep -qi "SceVideoOut" Makefile
          grep -q "scePadReadState" source/main.cpp
          ! grep -q "diagnostic build started" source/main.cpp

      - name: Vérifier les outils OpenOrbis
        run: |
          set -eu
          test -x /lib/OpenOrbisSDK/bin/linux/create-eboot
          test -x /lib/OpenOrbisSDK/bin/linux/PkgTool.Core
          test -s source/common/graphics.cpp
          test -s source/common/png.cpp
          test -f /lib/OpenOrbisSDK/include/stb/stb_image.h

      - name: Compiler et créer le PKG
        run: |
          set -eu
          export OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK
          export PATH="$OO_PS4_TOOLCHAIN/bin/linux:$OO_PS4_TOOLCHAIN:$PATH"
          make clean
          make V=1
          test -s source/x64/Debug/blackout.elf
          test -s eboot.bin
          test -s IV0000-BLSG00001_00-0000000000000001.pkg
          ls -lh source/x64/Debug/blackout.elf eboot.bin IV0000-BLSG00001_00-0000000000000001.pkg
          sha256sum source/x64/Debug/blackout.elf eboot.bin IV0000-BLSG00001_00-0000000000000001.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: blackout-goldhen-menu
          path: |
            source/x64/Debug/blackout.elf
            eboot.bin
            IV0000-BLSG00001_00-0000000000000001.pkg
          retention-days: 14
