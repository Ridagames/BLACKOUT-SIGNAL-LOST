name: Build BLACKOUT SIGNAL LOST PS4 - Native 1080p OBJ

on:
  push:
    branches: [main, master, "ps4/**", "diagnostic/**", "rebuild/**", "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: openorbisofficial/toolchain:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Installer ImageMagick
        run: |
          set -eu
          apt-get update
          apt-get install -y imagemagick
          convert -version

      - name: Recuperer create-fself officiel
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/create-fself
          ref: f2da6229684ce320f673c06fceac9c218f621788
          path: tools/create-fself-src

      - name: Recuperer create-gp4 officiel
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/create-gp4
          ref: bf8e66e9e9bdd92e41e1697893bc8098a151fa24
          path: tools/create-gp4-src

      - name: Installer Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.17'

      - name: Compiler create-fself
        working-directory: tools/create-fself-src/cmd/create-fself
        run: |
          set -eu
          go build -modfile=go-linux.mod -o /usr/local/bin/create-fself .
          test -x /usr/local/bin/create-fself
          /usr/local/bin/create-fself -h

      - name: Compiler create-gp4
        working-directory: tools/create-gp4-src/cmd/create-gp4
        run: |
          set -eu
          go build -o /usr/local/bin/create-gp4 .
          test -x /usr/local/bin/create-gp4
          /usr/local/bin/create-gp4 -h

      - name: Verifier les sources et le modele 3D OBJ
        run: |
          set -eu
          check_file() { test -s "$1" || { echo "FICHIER MANQUANT: $1"; exit 1; }; }
          check_file Makefile
          check_file source/main.cpp
          check_file source/common/graphics.cpp
          check_file source/common/graphics.h
          check_file source/common/obj_renderer.cpp
          check_file source/common/obj_renderer.h
          check_file assets/MODELS/NEXUS9_MENU.OBJ
          check_file sce_sys/ICON0.PNG
          grep -Fq 'ObjRenderer menuScene' source/main.cpp
          grep -Fq 'NEXUS9_MENU.OBJ' source/main.cpp
          grep -Fq 'OBJ_OBJ' Makefile
          grep -Fq 'USRDIR/MODELS/NEXUS9_MENU.OBJ' Makefile
          if grep -Eq 'BLACKOUT_MENU.mp4|SceAvPlayer|VideoPlayer' source/main.cpp Makefile; then
            echo "ANCIEN SYSTEME VIDEO ENCORE REFERENCE"
            exit 1
          fi
          echo "VERIFICATIONS OBJ ET MENU TEMPS REEL OK"

      - name: Verifier OpenOrbis et les modules PRX
        run: |
          set -eu
          test -x /usr/local/bin/create-fself
          test -x /usr/local/bin/create-gp4
          test -x /lib/OpenOrbisSDK/bin/linux/PkgTool.Core
          test -s /lib/OpenOrbisSDK/bin/data/modules/libc.prx
          test -s /lib/OpenOrbisSDK/bin/data/modules/libSceFios2.prx
          echo "MODULES OPENORBIS OK"

      - name: Compiler et creer le PKG PS4
        run: |
          set -eu
          export OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK
          export CREATE_FSELF=/usr/local/bin/create-fself
          export CREATE_GP4=/usr/local/bin/create-gp4
          export PATH="$OO_PS4_TOOLCHAIN/bin/linux:$OO_PS4_TOOLCHAIN:/usr/local/bin:$PATH"
          make clean
          make V=1
          test -s source/x64/Debug/blackout.elf
          test -s source/x64/Debug/blackout.oelf
          test -s eboot.bin
          test -s sce_sys/param.sfo
          test -s sce_sys/icon0.png
          test -s build/pkg/USRDIR/MODELS/NEXUS9_MENU.OBJ
          test -s build/pkg/sce_module/libc.prx
          test -s build/pkg/sce_module/libSceFios2.prx
          PKG="IV0000-BLSG00001_00-0000000000000001.pkg"
          test -s "$PKG"
          od -An -N4 -tx1 eboot.bin | grep -q "4f 15 3d 1d"
          test "$(identify -format '%wx%h' sce_sys/icon0.png)" = "512x512"
          echo "===== SFO CONTENT ====="
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" sfo_listentries sce_sys/param.sfo
          echo "===== PKG INTEGRITY VALIDATION ====="
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" pkg_validate --verbose "$PKG"
          echo "===== PKG CONTENTS ====="
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" pkg_listentries "$PKG"
          ls -lh eboot.bin sce_sys/param.sfo sce_sys/icon0.png build/pkg/USRDIR/MODELS/NEXUS9_MENU.OBJ "$PKG"
          sha256sum eboot.bin sce_sys/param.sfo sce_sys/icon0.png build/pkg/USRDIR/MODELS/NEXUS9_MENU.OBJ "$PKG"

      - uses: actions/upload-artifact@v4
        with:
          name: blackout-ps4-realtime-3d-obj
          path: |
            eboot.bin
            sce_sys/param.sfo
            sce_sys/icon0.png
            IV0000-BLSG00001_00-0000000000000001.pkg
          retention-days: 14
