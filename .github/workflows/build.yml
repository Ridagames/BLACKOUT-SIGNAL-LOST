name: Build BLACKOUT PS4

on:
  push:
    branches:
      - "ps4/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make curl libicu-dev clang lld imagemagick
          base="http://security.ubuntu.com/ubuntu/pool/main/o/openssl/"
          ver="$(curl -fsSL "$base" | grep -oE 'libssl1\\.1_1\\.1\\.1f-[0-9a-z.~+]+_amd64\\.deb' | sed -E 's/^libssl1\\.1_(.*)_amd64\\.deb$/\\1/' | sort -V | tail -1)"
          test -n "$ver"
          curl -fsSL "${base}libssl1.1_${ver}_amd64.deb" -o libssl1.1.deb
          sudo dpkg -i libssl1.1.deb || sudo apt-get install -f -y

      - name: Install OpenOrbis Toolchain v0.5.4
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o oo-toolchain.tar.gz
          mkdir -p "$HOME/openorbis"
          tar -xzf oo-toolchain.tar.gz -C "$HOME/openorbis"
          OO_ROOT="$(dirname "$(find "$HOME/openorbis" -name link.x -type f -print -quit)")"
          test -n "$OO_ROOT"
          test -f "$OO_ROOT/link.x"
          echo "OO_PS4_TOOLCHAIN=$OO_ROOT" >> "$GITHUB_ENV"
          echo "OpenOrbis root: $OO_ROOT"

      - name: Prepare package metadata and icon
        run: |
          set -euo pipefail
          mkdir -p sce_sys/about
          RIGHT="$(find "$OO_PS4_TOOLCHAIN" -name right.sprx -type f -print -quit)"
          if [ -z "$RIGHT" ]; then
            echo "right.sprx absent from toolchain"
            exit 1
          fi
          cp "$RIGHT" sce_sys/about/right.sprx
          convert -background "#080b12" assets/blackout-icon.svg -resize 512x512 sce_sys/icon0.png
          test -s sce_sys/icon0.png

      - name: Build PS4 PKG
        run: |
          set -euo pipefail
          CLANG="$(find "$OO_PS4_TOOLCHAIN" -type f -name clang -print -quit)"
          CLANGXX="$(find "$OO_PS4_TOOLCHAIN" -type f -name clang++ -print -quit)"
          LLD="$(find "$OO_PS4_TOOLCHAIN" -type f -name ld.lld -print -quit)"
          make clean
          make CC="${CLANG:-clang}" CXX="${CLANGXX:-clang++}" LD="${LLD:-ld.lld}" V=1
          test -s eboot.bin
          test -s IV0000-BLSG00001_00-0000000000000001.pkg
          file eboot.bin
          ls -lh eboot.bin IV0000-BLSG00001_00-0000000000000001.pkg
          sha256sum eboot.bin IV0000-BLSG00001_00-0000000000000001.pkg

      - name: Upload PS4 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BLACKOUT-SIGNAL-LOST-PS4
          path: |
            IV0000-BLSG00001_00-0000000000000001.pkg
            eboot.bin
            source/x64/Debug/*.elf
          if-no-files-found: error
          retention-days: 30
