name: Build PS4 Homebrew

on:
  push:
    branches: [main, master, "ps4/**", "diagnostic/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: openorbisofficial/toolchain:latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérif projet
        run: |
          set -eu
          test -f Makefile
          test -f source/main.cpp
          test -s assets/USRDIR/BLACKOUT_MENU.png
          test -s sce_sys/about/right.sprx
          test -s sce_sys/icon0.png

      - name: Build
        run: |
          set -eu
          export OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK
          export PATH="$OO_PS4_TOOLCHAIN/bin/linux:$OO_PS4_TOOLCHAIN:$PATH"
          make clean
          make V=1
          test -s eboot.bin
          file eboot.bin
          test -s IV0000-BLSG00001_00-0000000000000001.pkg
          ls -lh IV0000-BLSG00001_00-0000000000000001.pkg
          sha256sum eboot.bin IV0000-BLSG00001_00-0000000000000001.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: blackout-pkg
          path: |
            eboot.bin
            IV0000-BLSG00001_00-0000000000000001.pkg
          retention-days: 14
