name: Build PS3 Homebrew

'on':
push:
branches: [main, master]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 60

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Verify project files
    run: |
      set -eu
      test -f Makefile
      test -f source/main.cpp
      test -s assets/USRDIR/BLACKOUT_MENU.png
      echo "Fichiers du projet vérifiés."

  - name: Build ELF and PKG
    run: |
      set -eu
      docker run --rm \
        -v "$PWD:/workspace" \
        -w /workspace \
        hldtux/ps3dev:latest \
        bash -lc '
          set -eu
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"

          HEADER="$(find "$PS3DEV" -type f \
            -path "*/freetype/config/ftheader.h" \
            -print -quit 2>/dev/null || true)"

          if [ -n "$HEADER" ]; then
            HEADER_DIR="$(dirname "$(dirname "$(dirname "$(dirname "$HEADER")")")")"
            export CFLAGS="${CFLAGS:-} -I$HEADER_DIR"
            export CXXFLAGS="${CXXFLAGS:-} -I$HEADER_DIR"
          fi

          make clean
          make
          test -s blackout.elf
          make blackout.pkg
          test -s blackout.pkg
          echo "Build réussi."
          ls -lh blackout.elf blackout.pkg
        '

  - name: Collect artifacts
    if: always()
    run: |
      mkdir -p dist
      [ ! -s blackout.elf ] || cp blackout.elf dist/
      [ ! -s blackout.pkg ] || cp blackout.pkg dist/
      mkdir -p dist/USRDIR
      cp assets/USRDIR/BLACKOUT_MENU.png dist/USRDIR/

  - name: Upload artifacts
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: blackout-ps3-build
      path: dist/
      if-no-files-found: warn
      retention-days: 14
