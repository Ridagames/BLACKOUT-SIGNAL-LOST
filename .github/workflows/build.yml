
name: Build PS3 Homebrew

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect PS3 graphics APIs
        run: |
          docker run --rm hldtux/ps3dev:latest bash -lc '
            ROOT=/usr/local/ps3dev

            echo "===== NoRSX class methods ====="
            grep -R -n -E "class |public:|void |int |bool |Draw|Print|Font|Background|Image|Rectangle|Line" \
              "$ROOT/portlibs/ppu/include/NoRSX.h" \
              "$ROOT/portlibs/ppu/include/NoRSX" \
              2>/dev/null | head -250

            echo "===== PSL1GHT startup headers ====="
            find "$ROOT/ppu/include" -maxdepth 3 -type f \
              \( -name "sysutil.h" -o -name "video.h" -o -name "rsx.h" \) \
              -print 2>/dev/null

            echo "===== Available PS3 libraries ====="
            ls "$ROOT/ppu/lib" | grep -E "rsx|sysutil|gcm|gcm_sys|c" | head -100

            echo "===== NoRSX files ====="
            find "$ROOT/portlibs/ppu/include/NoRSX" -maxdepth 2 -type f -print
          '

      - name: Build ELF
        run: |
          docker run --rm \
            -v "$PWD:/build" \
            -w /build \
            hldtux/ps3dev:latest \
            bash -lc '
              export PS3DEV=/usr/local/ps3dev
              export PSL1GHT=$PS3DEV
              export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"
              make clean
              make
              test -s blackout.elf
            '

      - name: Collect build outputs
        if: always()
        run: |
          mkdir -p dist
          if [ -s blackout.elf ]; then
            cp blackout.elf dist/
            echo "ELF generated." > dist/BUILD-STATUS.txt
          else
            echo "ELF not generated. Check build logs." > dist/BUILD-STATUS.txt
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackout-ps3-build
          path: dist/
          if-no-files-found: warn
          retention-days: 14
