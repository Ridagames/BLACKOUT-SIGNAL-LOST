name: Build PS4 Homebrew (OpenOrbis FSELF)

on:
  push:
    branches: [main, master, "ps4/**", "diagnostic/**", "rebuild/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: openorbisofficial/toolchain:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Installer ImageMagick pour l'icône PS4
        run: |
          set -eu
          apt-get update
          apt-get install -y imagemagick
          convert -version

      - name: Récupérer create-fself officiel
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/create-fself
          ref: f2da6229684ce320f673c06fceac9c218f621788
          path: tools/create-fself-src

      - name: Récupérer create-gp4 officiel
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/create-gp4
          ref: bf8e66e9e9bdd92e41e1697893bc8098a151fa24
          path: tools/create-gp4-src

      - name: Installer Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.17'

      - name: Compiler create-fself
        working-directory: tools/create-fself-src/cmd/create-fself
        run: |
          set -eu
          go build -modfile=go-linux.mod -o /usr/local/bin/create-fself .
          test -x /usr/local/bin/create-fself
          /usr/local/bin/create-fself -h

      - name: Compiler create-gp4
        working-directory: tools/create-gp4-src/cmd/create-gp4
        run: |
          set -eu
          go build -o /usr/local/bin/create-gp4 .
          test -x /usr/local/bin/create-gp4
          /usr/local/bin/create-gp4 -h

      - name: Vérifier les sources et le menu
        run: |
          set -eu
          check_file() { test -s "$1" || { echo "FICHIER MANQUANT: $1"; exit 1; }; }
          check_text() { grep -Fq -- "$2" "$1" || { echo "TEXTE MANQUANT dans $1: $2"; exit 1; }; }
          check_file Makefile
          check_file source/main.cpp
          check_file assets/USRDIR/BLACKOUT_MENU.png
          check_file sce_sys/ICON0.PNG
          check_file source/common/graphics.cpp
          check_file source/common/png.cpp
          check_text Makefile "DIAGNOSTIC_BUILD"
          check_text source/main.cpp "BLACKOUT_MENU_FULLSCREEN_STARTING"
          check_text source/main.cpp "BLACKOUT_MENU_IMAGE_LOAD_FAILED"
          check_text Makefile "create-fself"
          check_text Makefile "-lSceVideoOut"
          check_text Makefile "-lScePad"
          check_text Makefile "sce_module/libc.prx"
          check_text Makefile "sce_module/libSceFios2.prx"
          check_text Makefile "create-gp4"
          echo "VERIFICATIONS DES SOURCES OK"

      - name: Vérifier OpenOrbis, les PRX et les outils
        run: |
          set -eu
          test -x /usr/local/bin/create-fself
          test -x /usr/local/bin/create-gp4
          test -x /lib/OpenOrbisSDK/bin/linux/PkgTool.Core
          test -s /lib/OpenOrbisSDK/bin/data/modules/libc.prx
          test -s /lib/OpenOrbisSDK/bin/data/modules/libSceFios2.prx
          test -s source/common/graphics.cpp
          test -s source/common/png.cpp
          test -f /lib/OpenOrbisSDK/include/stb/stb_image.h
          echo "===== OPENORBIS PRX MODULES ====="
          ls -lh /lib/OpenOrbisSDK/bin/data/modules/libc.prx /lib/OpenOrbisSDK/bin/data/modules/libSceFios2.prx

      - name: Compiler et créer le vrai PKG PS4
        run: |
          set -eu
          export OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK
          export CREATE_FSELF=/usr/local/bin/create-fself
          export CREATE_GP4=/usr/local/bin/create-gp4
          export PATH="$OO_PS4_TOOLCHAIN/bin/linux:$OO_PS4_TOOLCHAIN:/usr/local/bin:$PATH"
          make clean
          make V=1
          test -s source/x64/Debug/blackout.elf
          test -s source/x64/Debug/blackout.oelf
          test -s eboot.bin
          test -s sce_sys/param.sfo
          test -s sce_sys/icon0.png
          test -s build/pkg/sce_module/libc.prx
          test -s build/pkg/sce_module/libSceFios2.prx
          PKG="IV0000-BLSG00001_00-0000000000000001.pkg"
          test -s "$PKG"
          od -An -N4 -tx1 eboot.bin | grep -q "4f 15 3d 1d"
          identify -format '%m %wx%h %[channels]\\n' sce_sys/icon0.png
          test "$(identify -format '%wx%h' sce_sys/icon0.png)" = "512x512"
          test "$(identify -format '%[channels]' sce_sys/icon0.png)" = "srgb"
          echo "===== SFO CONTENT ====="
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" sfo_listentries sce_sys/param.sfo
          echo "===== PKG INTEGRITY VALIDATION ====="
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" pkg_validate --verbose "$PKG"
          echo "===== PKG ENTRY TABLE ====="
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" pkg_listentries "$PKG"
          ls -lh eboot.bin sce_sys/param.sfo sce_sys/icon0.png build/pkg/sce_module/libc.prx build/pkg/sce_module/libSceFios2.prx "$PKG"
          sha256sum eboot.bin sce_sys/param.sfo sce_sys/icon0.png build/pkg/sce_module/libc.prx build/pkg/sce_module/libSceFios2.prx "$PKG"

      - uses: actions/upload-artifact@v4
        with:
          name: blackout-ps4-fself-pkg
          path: |
            eboot.bin
            sce_sys/param.sfo
            sce_sys/icon0.png
            IV0000-BLSG00001_00-0000000000000001.pkg
          retention-days: 14
