name: Build PS3 Homebrew

'on':
push:
branches: [main, master]
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Verify files
    run: test -f Makefile && test -f source/main.cpp && test -s assets/USRDIR/BLACKOUT_MENU.png

  - name: Build
    run: docker run --rm -v "$PWD:/workspace" -w /workspace hldtux/ps3dev:latest bash -c "export PS3DEV=/usr/local/ps3dev; export PSL1GHT=\$PS3DEV; export PATH=\$PS3DEV/bin:\$PS3DEV/ppu/bin:\$PS3DEV/spu/bin:\$PATH; make clean && make && test -s blackout.elf && make blackout.pkg && test -s blackout.pkg"

  - name: Upload PKG
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: blackout-ps3-build
      path: blackout.pkg
      if-no-files-found: error
      retention-days: 14
