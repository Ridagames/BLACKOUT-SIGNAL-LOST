name: Build PS3 Homebrew

'on':
push:
branches:
- main
- master
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 60

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Verify project files
    shell: bash
    run: |
      set -eu
      test -f Makefile
      test -f source/main.cpp
      test -s assets/USRDIR/BLACKOUT_MENU.png

  - name: Build ELF and PKG
    shell: bash
    run: |
      set -eu
      docker run --rm \
        -v "$PWD:/workspace" \
        -w /workspace \
        hldtux/ps3dev:latest \
        bash -lc '
          set -eu
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT="$PS3DEV"
          export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"
          make clean
          make
          test -s blackout.elf
          make blackout.pkg
          test -s blackout.pkg
        '

  - name: Upload PKG
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: blackout-ps3-build
      path: blackout.pkg
      if-no-files-found: error
      retention-days: 14
