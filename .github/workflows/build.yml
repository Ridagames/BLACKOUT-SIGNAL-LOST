
name: Build PS3 Homebrew

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f Makefile
          test -f source/main.cpp
          test -f BLACKOUT_MENU.png
          echo "Project files found."

      - name: Prepare game resources
        run: |
          mkdir -p assets/USRDIR
          cp BLACKOUT_MENU.png assets/USRDIR/BLACKOUT_MENU.png
          echo "Resources prepared:"
          find assets -type f

      - name: Build ELF
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            hldtux/ps3dev:latest \
            bash -lc '
              set -eu

              export PS3DEV=/usr/local/ps3dev
              export PSL1GHT=$PS3DEV
              export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"

              HEADER="$(find "$PS3DEV" -type f \
                -path "*/freetype/config/ftheader.h" \
                -print -quit 2>/dev/null || true)"

              if [ -z "$HEADER" ]; then
                echo "ERROR: FreeType headers not found."
                exit 1
              fi

              HEADER_DIR="$(dirname "$(dirname "$(dirname "$(dirname "$HEADER")")")")"
              export CFLAGS="${CFLAGS:-} -I$HEADER_DIR"
              export CXXFLAGS="${CXXFLAGS:-} -I$HEADER_DIR"

              make clean
              make

              test -s blackout.elf
              file blackout.elf
            '

      - name: Collect game files
        if: always()
        run: |
          mkdir -p dist/USRDIR

          if [ -s blackout.elf ]; then
            cp blackout.elf dist/
          fi

          if [ -s assets/USRDIR/BLACKOUT_MENU.png ]; then
            cp assets/USRDIR/BLACKOUT_MENU.png dist/USRDIR/
          fi

          cat > dist/README.txt <<'EOF'
          BLACKOUT: SIGNAL LOST
          PS3 homebrew development build

          blackout.elf is the compiled executable.
          USRDIR/BLACKOUT_MENU.png is the menu background resource.

          These files are not yet a ready-to-install PS3 PKG.
          The package metadata and resource loading path still need integration.
          EOF

          find dist -type f -print

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackout-ps3-build
          path: dist/
          if-no-files-found: warn
          retention-days: 14
