name: Build PS4 Homebrew

on:
  push:
    branches: [main, master, "ps4/**", "diagnostic/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: openorbisofficial/toolchain:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Vérif projet
        run: |
          set -eu
          test -f Makefile
          test -f source/main.cpp
          test -s assets/USRDIR/BLACKOUT_MENU.png

      - name: Inspecter les outils OpenOrbis
        run: |
          set -eu
          echo "SDK: /lib/OpenOrbisSDK"
          find /lib/OpenOrbisSDK -type f \\( -name 'create-fself' -o -name 'create-gp4' -o -name 'PkgTool.Core' \\) -print
          echo "Executables dans bin:"
          find /lib/OpenOrbisSDK/bin -maxdepth 3 -type f -print 2>/dev/null | head -80 || true

      - name: Build
        run: |
          set -eu
          export OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK
          export PATH="$OO_PS4_TOOLCHAIN/bin/linux:$OO_PS4_TOOLCHAIN:$PATH"
          make clean
          make V=1
          test -s eboot.bin
          file eboot.bin
          test -s IV0000-BLSG00001_00-0000000000000001.pkg
          ls -lh IV0000-BLSG00001_00-0000000000000001.pkg
          sha256sum eboot.bin IV0000-BLSG00001_00-0000000000000001.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: blackout-pkg
          path: |
            eboot.bin
            IV0000-BLSG00001_00-0000000000000001.pkg
          retention-days: 14
