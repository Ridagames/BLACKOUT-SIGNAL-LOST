name: UE5 OpenOrbis — toolchain probe

on:
  push:
    branches: ["research/ue5-openorbis"]
    paths:
      - "research/ue5-openorbis/**"
      - ".github/workflows/ue5-openorbis-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-probe:
    runs-on: ubuntu-20.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain prerequisites
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y clang-12 lld-12 libicu66 libssl1.1 curl tar
          clang++-12 --version
          ld.lld-12 --version

      - name: Install the official OpenOrbis 0.5.2 release
        run: |
          set -eux
          SDK="$HOME/OpenOrbisSDK"
          mkdir -p "$SDK"
          curl --fail --location --retry 3 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.2/v0.5.2.tar.gz \
            -o /tmp/openorbis.tar.gz
          tar -xzf /tmp/openorbis.tar.gz -C "$SDK"
          test -f "$SDK/link.x"
          test -f "$SDK/include/orbis/libkernel.h"
          test -f "$SDK/lib/crt1.o"
          echo "OO_PS4_TOOLCHAIN=$SDK" >> "$GITHUB_ENV"

      - name: Compile and link the C++ probe
        run: |
          set -eux
          make -C research/ue5-openorbis clean
          make -C research/ue5-openorbis OO_PS4_TOOLCHAIN="$OO_PS4_TOOLCHAIN"
          file research/ue5-openorbis/build/ue5_orbis_probe.elf
          readelf -h research/ue5-openorbis/build/ue5_orbis_probe.elf
          sha256sum research/ue5-openorbis/build/ue5_orbis_probe.elf

      - uses: actions/upload-artifact@v4
        with:
          name: ue5-openorbis-toolchain-probe
          path: research/ue5-openorbis/build/ue5_orbis_probe.elf
          if-no-files-found: error
          retention-days: 14
